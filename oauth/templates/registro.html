{% extends 'auth-base.html' %}

{% load static %}

{% block content%}

        <div class="row">
            <div class="col-lg-5 d-none d-lg-block bg-register-image"><img src="{% static 'img/register-img.svg' %}"></div>
            <div class="col-lg-7">
                <div class="p-5">
                    <div class="text-center">
                        <h1 class="h4 text-gray-900 mb-4">Crea una cuenta</h1>
                    </div>

                    <form class="user" method='POST' action="{%url 'register' %}" id="registerForm">
                        {% csrf_token %}
                        <div class="form-group row">
                            <div class="col-sm-6 mb-3 mb-sm-0">
                                <input type="text" class="form-control form-control-user" id="name"
                                    placeholder="name" name="name">
                                <label for="name"></label>
                            </div>
                            <div class="col-sm-6">
                                <input type="text" class="form-control form-control-user" id="lastName"
                                    placeholder="lastaname" name='lastname'>
                                <label for="lastName"></label>
                            </div>
                        </div>
                        <div class="form-group">
                            <input type="email" class="form-control form-control-user" id="email"
                                placeholder="Emai" name='email'>
                                   <label for="email"></label>
                        </div>
                        <div class="form-group">
                            <input type="text" class="form-control form-control-user" id="userName"
                                placeholder="Username" name='username'>
                            <label for="userName"></label>
                        </div>
                        <div class="form-group">
                            <input type="password" class="form-control form-control-user" id="password"
                                placeholder="Password" name='password'>
                            <label for="password"></label>
                        </div>


                        <div class="col-12 form-group py-3">
                            <button class="btn btn-primary btn-user btn-block" id="submitBtn" type="submit">Crear cuenta</button>
                        </div>

                    </form>
                    <hr>
                    <div class="text-center">
                        <a class="small" href="{% url 'password_reset' %}">¿Olvidaste tu contraseña?</a>
                    </div>
                    <div class="text-center">
                        <a class="small" href="{% url 'view_login' %}">¿Ya tienes cuenta?</a>
                    </div>
                </div>
            </div>
        </div>
{% endblock %}

{% block script %}
    <script type="module" src="{% static 'js/validate-register.js' %}"></script>
{% endblock %}
